<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Sport AI Fitness Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #059669;
    --accent-dark: #047857;
    --accent-light: #ecfdf5;
    --accent-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --user-bubble-bg: linear-gradient(135deg, #059669 0%, #10b981 100%);
    --agent-bubble-bg: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
  }
  
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  
  /* --- App Header --- */
  header {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: bold;
    box-shadow: 0 0 0 1px rgba(5, 150, 105, 0.15);
  }
  .brand-text {
    display: flex;
    flex-direction: column;
  }
  .brand-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .brand-status {
    font-size: 0.78rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-weight: 500;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
  }
  
  /* --- Chat Area & Dialogue Layout --- */
  #main-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
  }
  
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  
  /* --- Messages --- */
  .msg {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    max-width: 88%;
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg.agent {
    align-self: flex-start;
  }
  
  /* --- Avatars --- */
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .avatar.user {
    background: var(--text-primary);
    color: #fff;
  }
  .avatar.agent {
    background: var(--accent-light);
    border: 1px solid rgba(5, 150, 105, 0.2);
    color: var(--accent);
  }
  
  /* --- Chat Bubbles --- */
  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    position: relative;
    box-shadow: var(--shadow-sm);
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble-bg);
    color: #ffffff;
    border-top-right-radius: 4px;
    font-weight: 450;
  }
  .msg.agent .bubble {
    background: var(--agent-bubble-bg);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* --- Prompt Chips --- */
  .prompt-chips {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(5, 150, 105, 0.12);
  }

  /* --- Input Bar --- */
  .input-wrapper {
    padding: 0.75rem 1rem 1.25rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 0.35rem 0.35rem 0.35rem 1rem;
    box-shadow: var(--shadow-md);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 4px 14px -2px rgba(5, 150, 105, 0.18);
  }
  input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text-primary);
  }
  input::placeholder {
    color: var(--text-muted);
  }
  button {
    padding: 0.65rem 1.25rem;
    border: none;
    border-radius: 22px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  button:hover {
    opacity: 0.94;
    transform: scale(1.02);
  }
  button:active {
    transform: scale(0.98);
  }

  /* --- A2UI Component Styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.825rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="brand-icon">🏋️</div>
    <div class="brand-text">
      <div class="brand-title">Multi-Sport AI Fitness Coach</div>
      <div class="brand-status"><span class="status-dot"></span> Active • Ready to Coach</div>
    </div>
  </div>
</header>

<div id="main-container">
  <div id="log"></div>

  <div class="prompt-chips">
    <button type="button" class="chip" onclick="sendPrompt('Find a 5K threshold tempo run workout')">🏃 5K Tempo Run</button>
    <button type="button" class="chip" onclick="sendPrompt('Calculate my training zones for max HR 185 and resting HR 55')">❤️ HR Training Zones</button>
    <button type="button" class="chip" onclick="sendPrompt('Check outdoor training weather conditions in San Francisco')">🌦️ SF Weather</button>
  </div>

  <div class="input-wrapper">
    <form id="form">
      <input id="input" placeholder="Ask your coach anything..." autocomplete="off" autofocus>
      <button type="submit">Send <span>➔</span></button>
    </form>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.requestSubmit();
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar " + who, who === "user" ? "👤" : "🏋️");
  const b = el("div", "bubble");
  if (who === "user") {
    m.appendChild(b);
    m.appendChild(avatar);
  } else {
    m.appendChild(avatar);
    m.appendChild(b);
  }
  log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function buildNode(id, comps, visited) {
  if (!id || visited.has(id)) return null;
  visited.add(id);
  const spec = comps[id];
  if (!spec) return null;
  const name = Object.keys(spec)[0];
  const props = spec[name] || {};

  if (name === "Card") {
    const card = el("div", "a2card");
    for (const cid of childIds(props)) { const n = buildNode(cid, comps, visited); if (n) card.appendChild(n); }
    return card;
  }
  if (name === "Column") {
    const col = el("div", "a2col");
    for (const cid of childIds(props)) { const n = buildNode(cid, comps, visited); if (n) col.appendChild(n); }
    return col;
  }
  if (name === "Row") {
    const row = el("div", "a2row" + (props.distribution === "space-between" ? " between" : ""));
    for (const cid of childIds(props)) { const n = buildNode(cid, comps, visited); if (n) row.appendChild(n); }
    return row;
  }
  if (name === "Text") {
    const style = (props.usageHint || "body").toLowerCase();
    const txt = el("p", "a2text a2-" + style, boundStr(props.text));
    return txt;
  }
  if (name === "Divider") return el("hr", "a2divider");
  if (name === "Image") {
    const url = boundStr(props.url);
    if (!url || (!url.startsWith("http://") && !url.startsWith("https://") && !url.startsWith("data:image/"))) return null;
    const img = el("img", "a2img"); img.src = url;
    return img;
  }
  if (name === "Icon") {
    const iconName = boundStr(props.name);
    return el("span", "material-symbols-outlined", iconName);
  }
  if (name === "List") {
    const col = el("div", "a2col");
    for (const cid of childIds(props)) { const n = buildNode(cid, comps, visited); if (n) col.appendChild(n); }
    return col;
  }
  const fallbackNode = el("div", null);
  for (const cid of childIds(props)) { const n = buildNode(cid, comps, visited); if (n) fallbackNode.appendChild(n); }
  return fallbackNode.childNodes.length ? fallbackNode : null;
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
